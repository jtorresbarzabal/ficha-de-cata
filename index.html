<style>
  :root {
    --bordeaux: #5C1F35;
    --bordeaux-dark: #401526;
    --cream: #F6EFE4;
    --gold: #B78A3D;
    --ink: #2B211D;
    --ink-soft: #776A60;
    --line: rgba(43,33,29,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    padding: 20px 14px 60px;
  }
  .shell { max-width: 720px; margin: 0 auto; }

  .header {
    background: linear-gradient(135deg, var(--bordeaux), var(--bordeaux-dark));
    border-radius: 18px;
    padding: 18px 20px;
    color: var(--cream);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .header-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1.5px solid rgba(246,239,228,0.4);
  }
  .header-school {
    font-size: clamp(12.5px, 4.2vw, 15px);
    font-weight: 700;
    letter-spacing: 0.2px;
    color: #E7D9CB;
    white-space: nowrap;
  }
  .header-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .header-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 6px;
  }
  .header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .header p { margin: 0; font-size: 12.5px; color: #E7D9CB; }
  .header-teacher {
    font-size: 11px;
    color: #C9B49A;
    margin-top: 6px;
  }

  .tabs { display: flex; gap: 8px; margin: 18px 0 16px; }
  .tab {
    flex: 1;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .tab.active { background: var(--bordeaux); border-color: var(--bordeaux); color: var(--cream); }
  .tab-badge { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: rgba(0,0,0,0.08); padding: 1px 6px; border-radius: 20px; margin-left: 4px; }
  .tab.active .tab-badge { background: rgba(255,255,255,0.2); }

  .steps { display: flex; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .step-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-block; }
  .step-dot.done { background: var(--gold); border-color: var(--gold); }

  .hero { display: flex; align-items: center; justify-content: center; gap: 18px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .hero-text { font-size: 12.5px; color: var(--ink-soft); max-width: 240px; }
  .hero-text b { color: var(--ink); }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 3px; color: var(--bordeaux-dark); }
  .card-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .grid, .grid3 { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field-label { font-size: 12.5px; font-weight: 600; }
  .hint { font-size: 11px; color: var(--ink-soft); line-height: 1.4; }

  .input, .textarea {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--cream);
    color: var(--ink);
    width: 100%;
  }
  .input:focus, .textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .textarea { font-family: 'Inter', sans-serif; min-height: 60px; resize: vertical; }

  .chipgroup { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--cream); color: var(--ink); padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip.active { background: var(--bordeaux); border-color: var(--bordeaux); color: #fff; }
  .chip-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.15); }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--bordeaux); }
  .slider-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: var(--bordeaux); min-width: 44px; text-align: right; }

  .save-row { display: flex; gap: 10px; margin-top: 6px; }
  .btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-primary { background: var(--bordeaux); color: #fff; flex: 1; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }

  .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty h3 { font-family: 'Fraunces', serif; color: var(--bordeaux-dark); margin-bottom: 6px; }

  .ficha-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; }
  .ficha-top { display: flex; align-items: center; gap: 12px; }
  .ficha-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); }
  .ficha-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; margin: 0; }
  .ficha-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .ficha-score { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--bordeaux); font-size: 15px; }

  .detail { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .detail-section { margin-bottom: 12px; }
  .detail-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--gold); margin: 0 0 6px; font-weight: 700; }
  .detail-row { font-size: 13px; margin-bottom: 3px; }
  .detail-actions { display: flex; gap: 8px; margin-top: 12px; }
  .detail-actions button { flex: 1; border-radius: 10px; padding: 9px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--cream); cursor: pointer; }
  .detail-actions .danger { color: #A23B3B; border-color: #E4B9B9; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--gold); color: #fff; font-size: 12.5px; font-weight: 600; padding: 10px 18px; border-radius: 999px; z-index: 999; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }

  .footnote { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 10px; }

  .photo-box { margin-bottom: 10px; }
  .photo-placeholder {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 26px 14px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
    background: var(--cream);
  }
  .photo-preview {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--line);
    display: block;
  }
  .photo-buttons { display: flex; gap: 8px; margin-top: 8px; margin-bottom: 14px; }
  .photo-buttons button {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--cream);
    color: var(--ink);
    padding: 10px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .photo-buttons .danger { color: #A23B3B; border-color: #E4B9B9; }
  .ficha-photo {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--line);
    margin-bottom: 10px;
  }
  /* ---- Mejoras UT4 ---- */
  .tab { padding: 10px 6px; font-size: 12.5px; white-space: nowrap; }
  .tab.small { flex: 0.8; }
  .deduction { background: #FBF3E0; border-left: 3px solid var(--gold); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.4; margin-top: 2px; }
  .aroma-group { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--cream); }
  .aroma-group .chip { background: #fff; }
  .aroma-group .chip.active { background: var(--bordeaux); }
  .aroma-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .aroma-head b { font-size: 12.5px; color: var(--bordeaux-dark); }
  .aroma-head span { font-size: 10.5px; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
  .aroma-group .hint { display: block; margin-top: 8px; }
  .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .score-label { min-width: 74px; font-size: 12.5px; font-weight: 600; }
  .score-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .score-chip { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; cursor: pointer; padding: 0; }
  .score-chip.active { background: var(--bordeaux); border-color: var(--bordeaux); color: #fff; }
  .score-max { font-size: 11px; color: var(--ink-soft); }
  .total-box { display: flex; justify-content: space-between; align-items: center; background: var(--bordeaux); color: var(--cream); border-radius: 12px; padding: 10px 14px; margin: 6px 0 14px; font-size: 13px; font-weight: 600; }
  .total-box b { font-family: 'Fraunces', serif; font-size: 26px; }
  .guide details { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .guide summary { cursor: pointer; padding: 14px 16px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; color: var(--bordeaux-dark); list-style: none; }
  .guide summary::-webkit-details-marker { display: none; }
  .guide summary::after { content: '＋'; float: right; color: var(--gold); }
  .guide details[open] summary::after { content: '－'; }
  .guide .gbody { padding: 0 16px 14px; font-size: 13px; line-height: 1.5; }
  .guide .gbody h5 { margin: 12px 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--gold); }
  .guide .gbody ul { margin: 0 0 6px; padding-left: 18px; }
  .guide .gbody li { margin-bottom: 3px; }
  .guide .rule { background: #FBF3E0; border-left: 3px solid var(--gold); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 12.5px; }
  .guide .row { display: flex; align-items: flex-start; gap: 9px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .guide .row:last-child { border-bottom: none; }
  .guide .row .sw { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; border: 1px solid rgba(0,0,0,0.15); }
  .guide dl { margin: 0; }
  .guide dt { font-weight: 700; color: var(--bordeaux-dark); margin-top: 7px; }
  .guide dd { margin: 0; color: var(--ink); }
</style>

function ribOpts(tipo) { return RIBETES[tipo] || RIBETES.blanco; }

function ribeteHex(f) {
  const found = ribOpts(f.tipo).opts.find(o => o[0] === f.ribete);
  return found ? found[1] : '';
}

function ribeteHint(f) {
  const found = ribOpts(f.tipo).opts.find(o => o[0] === f.ribete);
  return found ? found[2] : '';
}

function totalPts(o) {
  return (Number(o.ptsVisual) || 0) + (Number(o.ptsOlfativa) || 0) + (Number(o.ptsGustativa) || 0);
}

function aromasPorGrupo(f) {
  const fam = f.familias || [];
  const grupos = AROMAS.map(g => ({ g: g, sel: fam.filter(x => g.opts.indexOf(x) >= 0) }));
  const otras = fam.filter(x => FAMILIAS_AROMA.indexOf(x) < 0);
  return { grupos: grupos, otras: otras };
}

function hexToRgb(h) {
  h = (h || '').replace('#', '');
  if (h.length !== 6) return null;
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

let form = emptyForm();
let fichas = [];
let tab = 'nueva';
let expandedId = null;

try { fichas = JSON.parse(localStorage.getItem('fichasCata') || '[]'); } catch(e) { fichas = []; }

function persist() {
  try { localStorage.setItem('fichasCata', JSON.stringify(fichas)); }
  catch(e) { toast('No se ha podido guardar en este dispositivo.'); }
}

function hexFor(f) {
  const list = COLORS[f.tipo] || [];
  const found = list.find(c => c[0] === f.color);
  return found ? found[1] : '#9c8f86';
}

function esc(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ------------------------------------------------------------------ */
/* Interacciones globales                                              */
/* ------------------------------------------------------------------ */
window.setTab = function(t) { tab = t; expandedId = null; render(); };

window.setTipo = function(v) { form.tipo = v; form.color = ''; form.ribete = ''; render(); };

window.chipClick = function(field, value, multi) {
  if (multi) {
    const arr = form[field];
    const i = arr.indexOf(value);
    if (i >= 0) arr.splice(i, 1); else arr.push(value);
  } else {
    form[field] = form[field] === value ? '' : value;
  }
  render();
};

window.updateField = function(field, value) { form[field] = value; };

window.setPts = function(k, n) { form[k] = (form[k] === n) ? null : n; render(); };

window.resetForm = function() { form = emptyForm(); render(); };

window.handlePhotoChange = function(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      form.fotoEtiqueta = canvas.toDataURL('image/jpeg', 0.72);
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.removePhoto = function() { form.fotoEtiqueta = ''; render(); };

window.saveFicha = function() {
  if (!form.nombre || !form.nombre.trim()) {
    toast('Escribe el nombre del vino antes de guardar la ficha.');
    return;
  }
  const nueva = Object.assign({}, form, { valoracion: totalPts(form), id: Date.now().toString(), fecha: new Date().toISOString() });
  fichas = [nueva].concat(fichas);
  persist();
  form = emptyForm();
  toast('Ficha guardada en este dispositivo.');
  tab = 'fichas';
  render();
};

window.toggleExpand = function(id) {
  expandedId = expandedId === id ? null : id;
  render();
};

window.deleteFicha = function(id, ev) {
  ev.stopPropagation();
  fichas = fichas.filter(f => f.id !== id);
  persist();
  if (expandedId === id) expandedId = null;
  render();
};

function ensureJsPDF(callback) {
  if (window.jspdf && window.jspdf.jsPDF) { callback(); return; }
  const existing = document.getElementById('jspdf-lib');
  if (existing) { existing.addEventListener('load', callback); return; }
  const s = document.createElement('script');
  s.id = 'jspdf-lib';
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload = callback;
  s.onerror = function () { toast('No se pudo generar el PDF: revisa tu conexión a internet.'); };
  document.head.appendChild(s);
}

function generatePdfForFicha(f) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210, marginL = 15, marginR = 15;
  const contentRight = pageW - marginR;
  let y = 0;
  let colWidth = contentRight - marginL;

  function checkPageBreak(needed) {
    if (y + needed > 280) {
      doc.addPage();
      y = 20;
      colWidth = contentRight - marginL;
    }
  }
  function sectionHeader(title) {
    checkPageBreak(10);
    doc.setFillColor(242, 231, 211);
    doc.rect(marginL, y, colWidth, 6, 'F');
    doc.setTextColor(92, 31, 53);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text(title.toUpperCase(), marginL + 2, y + 4.2);
    y += 9;
    doc.setTextColor(43, 33, 29);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
  }
  function line(label, value, hex) {
    checkPageBreak(6);
    doc.setFont('helvetica', 'bold');
    const labelStr = label + ':  ';
    doc.text(labelStr, marginL, y);
    const labelWidth = doc.getTextWidth(labelStr);
    doc.setFont('helvetica', 'normal');
    let off = 0;
    const rgb = (value && hex) ? hexToRgb(hex) : null;
    if (rgb) {
      doc.setFillColor(rgb[0], rgb[1], rgb[2]);
      doc.setDrawColor(150, 140, 130);
      doc.setLineWidth(0.2);
      doc.circle(marginL + labelWidth + 2, y - 1.3, 1.7, 'FD');
      off = 5.5;
    }
    const wrapped = doc.splitTextToSize(value || '-', colWidth - labelWidth - off);
    doc.text(wrapped, marginL + labelWidth + off, y);
    y += 5 * Math.max(wrapped.length, 1);
  }
  function paragraph(text) {
    checkPageBreak(10);
    const wrapped = doc.splitTextToSize(text || '-', colWidth);
    doc.text(wrapped, marginL, y);
    y += 5 * Math.max(wrapped.length, 1);
  }

  // Cabecera
  doc.setFillColor(92, 31, 53);
  doc.rect(0, 0, pageW, 26, 'F');
  try { doc.addImage(LOGO_B64, 'PNG', marginL, 5, 16, 16); } catch (e) {}
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('FICHA DE CATA', marginL + 20, 13);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.text('Módulo Profesional · El Vino y su Servicio  ·  Prof. José Torres Barzabal', marginL + 20, 19);

  y = 34;
  doc.setTextColor(43, 33, 29);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(f.nombre || 'Vino sin nombre', marginL, y);
  y += 3;
  doc.setDrawColor(183, 138, 61);
  doc.setLineWidth(0.5);
  doc.line(marginL, y, contentRight, y);
  y += 6;

  if (f.fotoEtiqueta) {
    try {
      doc.addImage(f.fotoEtiqueta, 'JPEG', contentRight - 45, y, 45, 45);
      colWidth = (contentRight - 50) - marginL;
    } catch (e) {}
  }

  sectionHeader('Datos del vino');
  line('Bodega', f.bodega);
  line('D.O. / Zona vinícola', f.doZona);
  line('Añada', f.anada);
  line('Variedad de uva', f.variedad);
  line('Crianza', f.crianza);
  line('Graduación', f.graduacion ? f.graduacion + ' % vol.' : '-');
  line('Temperatura de servicio', f.temperatura ? f.temperatura + ' °C' : '-');
  line('Precio', f.precio ? f.precio + ' €' : '-');
  y += 2;

  sectionHeader('Fase visual');
  line('Tipo', f.tipo ? f.tipo.charAt(0).toUpperCase() + f.tipo.slice(1) : '-');
  line('Color', f.color, hexFor(f));
  line(f.tipo === 'tinto' ? 'Ribete' : 'Reflejos', f.ribete, ribeteHex(f));
  line('Evolución', f.evolucion);
  line('Intensidad de color (capa)', f.intensidadColor);
  line('Limpidez', f.limpidez);
  line('Lágrima', f.lagrima);
  if (f.tipo === 'espumoso') {
    line('Tipo de burbuja', f.tipoBurbuja);
    line('Cantidad de burbujas', f.cantidadBurbujas);
    line('Persistencia de la burbuja', f.persistenciaBurbuja);
  }
  y += 2;
  colWidth = contentRight - marginL;

  sectionHeader('Fase olfativa');
  line('Intensidad aromática', f.intensidadAroma);
  line('Calidad', f.calidadAroma);
  line('Franqueza', f.franqueza);
  const ap = aromasPorGrupo(f);
  ap.grupos.forEach(function (x) { line(x.g.pdf, x.sel.length ? x.sel.join(', ') : '-'); });
  if (ap.otras.length) line('Otras familias', ap.otras.join(', '));
  line('Notas', f.notasAroma);
  y += 2;

  sectionHeader('Fase gustativa');
  line('Dulzor', f.dulzor);
  line('Acidez', f.acidez);
  if (f.tipo === 'tinto' || f.tipo === 'rosado') line('Taninos', f.taninos);
  line('Alcohol', f.alcohol);
  line('Cuerpo', f.cuerpo);
  line('Entrada en boca', f.entrada);
  line('Final de boca', f.finalBoca);
  if (f.tipo === 'espumoso') line('Carbónico', f.carbonico);
  line('Persistencia (PAI)', f.persistencia);
  line('Equilibrio', f.equilibrio);
  y += 2;

  sectionHeader('Maridaje y valoración');
  line('Maridaje recomendado', f.maridaje);
  if (f.ptsVisual != null || f.ptsOlfativa != null || f.ptsGustativa != null) {
    line('Puntuación por fases', 'Visual ' + (Number(f.ptsVisual) || 0) + '/2  ·  Olfativa ' + (Number(f.ptsOlfativa) || 0) + '/3  ·  Gustativa ' + (Number(f.ptsGustativa) || 0) + '/5');
  }
  line('Valoración global', f.valoracion + ' / 10');
  y += 2;

  sectionHeader('Conclusión');
  paragraph(f.conclusion);

  const pageCount = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    doc.setFontSize(8);
    doc.setTextColor(150, 140, 130);
    doc.text('Escuela de Hostelería San Roque · Ficha de Cata', marginL, 292);
  }

  const filename = 'ficha-cata-' + (f.nombre || 'vino').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.pdf';
  doc.save(filename);
}

window.downloadFicha = function(id, ev) {
  ev.stopPropagation();
  const f = fichas.find(x => x.id === id);
  if (!f) return;
  toast('Generando PDF…');
  ensureJsPDF(function () { generatePdfForFicha(f); });
};

let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast-box');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast-box';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

/* Helpers de plantilla                                                */

function chipGroup(field, options, multi, colored) {
  const selected = form[field];
  return '<div class="chipgroup">' + options.map(opt => {
    const label = colored ? opt[0] : opt;
    const hex = colored ? opt[1] : null;
    const active = multi ? selected.includes(label) : selected === label;
    const dot = hex ? '<span class="chip-dot" style="background:' + hex + '"></span>' : '';
    return '<button type="button" class="chip' + (active ? ' active' : '') + '" onclick="chipClick(\'' + field + '\',\'' + label.replace(/'/g,"\\'") + '\',' + (multi ? 'true' : 'false') + ')">' + dot + esc(label) + '</button>';
  }).join('') + '</div>';
}

function field(label, hint, inner) {
  const tag = /^<(input|textarea)/.test(inner) ? 'label' : 'div';
  return '<' + tag + ' class="field"><span class="field-label">' + label + '</span>' + inner + (hint ? '<span class="hint">ⓘ ' + hint + '</span>' : '') + '</' + tag + '>';
}

function textInput(fieldName, placeholder, value) {
  return '<input class="input" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '" oninput="updateField(\'' + fieldName + '\', this.value)" />';
}

function textArea(fieldName, placeholder, value) {
  return '<textarea class="textarea" placeholder="' + esc(placeholder) + '" oninput="updateField(\'' + fieldName + '\', this.value)">' + esc(value) + '</textarea>';
}

function wineGlass(hex, rib) {
  const has = hex && hex !== '#9c8f86';
  return '<svg width="100" height="140" viewBox="0 0 120 160">' +
    '<defs><clipPath id="bowlClip"><path d="M22,12 C22,52 32,82 60,88 C88,82 98,52 98,12 Z"/></clipPath>' +
    '<clipPath id="liqClip"><rect x="0" y="46" width="120" height="50"/></clipPath>' +
    '<filter id="softEdge"><feGaussianBlur stdDeviation="2.5"/></filter></defs>' +
    (has ? '<g clip-path="url(#bowlClip)"><rect x="18" y="46" width="86" height="46" fill="' + hex + '" opacity="0.92"/>' +
      (rib ? '<g clip-path="url(#liqClip)"><path d="M22,12 C22,52 32,82 60,88 C88,82 98,52 98,12 Z" fill="none" stroke="' + rib + '" stroke-width="16" filter="url(#softEdge)" opacity="0.95"/></g>' : '') +
      '</g>' : '') +
    '<path d="M22,12 C22,52 32,82 60,88 C88,82 98,52 98,12 Z" fill="none" stroke="#B78A3D" stroke-width="2" opacity="0.55"/>' +
    '<line x1="60" y1="88" x2="60" y2="140" stroke="#B78A3D" stroke-width="2" opacity="0.55"/>' +
    '<ellipse cx="60" cy="145" rx="26" ry="6" fill="none" stroke="#B78A3D" stroke-width="2" opacity="0.55"/>' +
    '</svg>';
}

function stepDot(done, label) {
  return '<div class="step"><span class="step-dot' + (done ? ' done' : '') + '"></span>' + label + '</div>';
}

function scoreRows() {
  return PUNTOS.map(p => {
    let chips = '';
    for (let n = 0; n <= p.max; n++) {
      chips += '<button type="button" class="score-chip' + (form[p.k] === n ? ' active' : '') + '" onclick="setPts(\'' + p.k + '\',' + n + ')">' + n + '</button>';
    }
    return '<div class="score-row"><span class="score-label">' + p.l + '</span><div class="score-chips">' + chips + '</div><span class="score-max">de ' + p.max + '</span></div>';
  }).join('');
}

function aromaGroups() {
  return AROMAS.map(g =>
    '<div class="aroma-group"><div class="aroma-head"><b>' + g.t + '</b><span>' + g.s + '</span></div>' +
    chipGroup('familias', g.opts, true) +
    '<span class="hint">ⓘ ' + g.ej + '</span></div>'
  ).join('');
}

  html += field('Nombre del vino', null, textInput('nombre', 'Ej: Viña Alta Reserva', form.nombre));
  html += '<div class="grid">' + field('Bodega', null, textInput('bodega', 'Nombre de la bodega', form.bodega)) + field('D.O. / Zona vinícola', null, textInput('doZona', 'Ej: Ribera del Duero', form.doZona)) + '</div>';
  html += '<div class="grid3">' + field('Añada', null, textInput('anada', '2022', form.anada)) + field('Graduación %', null, textInput('graduacion', '13.5', form.graduacion)) + field('Precio €', null, textInput('precio', '9.90', form.precio)) + '</div>';
  html += '<div class="grid">' + field('Variedad de uva', null, textInput('variedad', 'Ej: Tempranillo', form.variedad)) + field('Temperatura de servicio °C', 'Medida o estimada al catar.', textInput('temperatura', 'Ej: 16', form.temperatura)) + '</div>';
  html += field('Crianza', null, chipGroup('crianza', CRIANZA));
  html += field('Maridaje', '¿Con qué platos combina bien este vino?', textArea('maridaje', 'Ej: carnes rojas a la brasa, quesos curados...', form.maridaje));
  html += field('Conclusión / observaciones', null, textArea('conclusion', 'Impresión general, momento de consumo recomendado...', form.conclusion));
  html += '<div class="save-row"><button class="btn btn-primary" onclick="saveFicha()">💾 Guardar ficha</button><button class="btn btn-ghost" onclick="resetForm()">Limpiar</button></div>';
  html += '</div>';

  html += '<p class="footnote">Tus fichas se guardan solo en este dispositivo y navegador.</p>';
  return html;
}

function fichasHTML() {
  if (fichas.length === 0) {
    return '<div class="empty"><div style="font-size:34px">📋</div><h3>Todavía no hay fichas guardadas</h3><p>Completa una cata en la pestaña "Nueva cata" para verla aquí.</p></div>';
  }
  return fichas.map(f => {
    const open = expandedId === f.id;
    const ribLabel = f.tipo === 'tinto' ? 'Ribete' : 'Reflejos';
    let card = '<div class="ficha-card" onclick="toggleExpand(\'' + f.id + '\')">';
    card += '<div class="ficha-top"><span class="ficha-dot" style="background:' + hexFor(f) + '"></span><div>';
    card += '<p class="ficha-title">' + esc(f.nombre) + '</p>';
    card += '<p class="ficha-meta">' + esc(f.doZona || 'Sin D.O.') + (f.anada ? ' · ' + esc(f.anada) : '') + ' · ' + new Date(f.fecha).toLocaleDateString('es-ES') + '</p>';
    card += '</div><span class="ficha-score">' + f.valoracion + '/10</span></div>';

    if (open) {
      const ap = aromasPorGrupo(f);
      let aromasHtml = ap.grupos.filter(x => x.sel.length).map(x => '<div class="detail-row"><b>' + x.g.pdf.replace('Aromas p','P').replace('Aromas s','S').replace('Aromas t','T') + ':</b> ' + esc(x.sel.join(', ')) + '</div>').join('');
      if (ap.otras.length) aromasHtml += '<div class="detail-row"><b>Otras:</b> ' + esc(ap.otras.join(', ')) + '</div>';
      if (!aromasHtml) aromasHtml = '<div class="detail-row"><b>Familias:</b> -</div>';
      card += '<div class="detail">';
      if (f.fotoEtiqueta) card += '<img src="' + f.fotoEtiqueta + '" class="ficha-photo" />';
      card += '<div class="detail-section"><h4>Visual</h4><div class="detail-row"><b>Color:</b> ' + esc(f.color || '-') + ' · <b>' + ribLabel + ':</b> ' + esc(f.ribete || '-') + '</div><div class="detail-row"><b>Evolución:</b> ' + esc(f.evolucion || '-') + ' · <b>Capa:</b> ' + esc(f.intensidadColor || '-') + '</div><div class="detail-row"><b>Limpidez:</b> ' + esc(f.limpidez || '-') + ' · <b>Lágrima:</b> ' + esc(f.lagrima || '-') + '</div>' +
        (f.tipo === 'espumoso' ? '<div class="detail-row"><b>Burbuja:</b> ' + esc(f.tipoBurbuja || '-') + ' · ' + esc(f.cantidadBurbujas || '-') + ' · persistencia ' + esc(f.persistenciaBurbuja || '-') + '</div>' : '') + '</div>';
      card += '<div class="detail-section"><h4>Olfativa</h4><div class="detail-row"><b>Intensidad:</b> ' + esc(f.intensidadAroma || '-') + ' · <b>Calidad:</b> ' + esc(f.calidadAroma || '-') + ' · <b>Franqueza:</b> ' + esc(f.franqueza || '-') + '</div>' + aromasHtml + (f.notasAroma ? '<div class="detail-row"><b>Notas:</b> ' + esc(f.notasAroma) + '</div>' : '') + '</div>';
      card += '<div class="detail-section"><h4>Gustativa</h4><div class="detail-row"><b>Dulzor:</b> ' + esc(f.dulzor || '-') + ' · <b>Acidez:</b> ' + esc(f.acidez || '-') + '</div>' + ((f.tipo === 'tinto' || f.tipo === 'rosado') ? '<div class="detail-row"><b>Taninos:</b> ' + esc(f.taninos || '-') + '</div>' : '') + '<div class="detail-row"><b>Alcohol:</b> ' + esc(f.alcohol || '-') + ' · <b>Cuerpo:</b> ' + esc(f.cuerpo || '-') + '</div><div class="detail-row"><b>Entrada:</b> ' + esc(f.entrada || '-') + ' · <b>Final:</b> ' + esc(f.finalBoca || '-') + '</div>' + (f.tipo === 'espumoso' ? '<div class="detail-row"><b>Carbónico:</b> ' + esc(f.carbonico || '-') + '</div>' : '') + '<div class="detail-row"><b>Persistencia:</b> ' + esc(f.persistencia || '-') + ' · <b>Equilibrio:</b> ' + esc(f.equilibrio || '-') + '</div></div>';
      card += '<div class="detail-section"><h4>Ficha</h4><div class="detail-row"><b>Bodega:</b> ' + esc(f.bodega || '-') + '</div><div class="detail-row"><b>Graduación:</b> ' + (f.graduacion ? esc(f.graduacion) + ' %' : '-') + ' · <b>Precio:</b> ' + (f.precio ? esc(f.precio) + ' €' : '-') + '</div><div class="detail-row"><b>Variedad:</b> ' + esc(f.variedad || '-') + (f.crianza ? ' · <b>Crianza:</b> ' + esc(f.crianza) : '') + (f.temperatura ? ' · <b>Servicio:</b> ' + esc(f.temperatura) + ' °C' : '') + '</div><div class="detail-row"><b>Maridaje:</b> ' + esc(f.maridaje || '-') + '</div>' +
        ((f.ptsVisual != null || f.ptsOlfativa != null || f.ptsGustativa != null) ? '<div class="detail-row"><b>Puntos:</b> Visual ' + (Number(f.ptsVisual) || 0) + '/2 · Olfativa ' + (Number(f.ptsOlfativa) || 0) + '/3 · Gustativa ' + (Number(f.ptsGustativa) || 0) + '/5</div>' : '') +
        (f.conclusion ? '<div class="detail-row"><b>Conclusión:</b> ' + esc(f.conclusion) + '</div>' : '') + '</div>';
      card += '<div class="detail-actions"><button onclick="downloadFicha(\'' + f.id + '\', event)">⬇ Descargar PDF</button><button class="danger" onclick="deleteFicha(\'' + f.id + '\', event)">🗑 Eliminar</button></div>';
      card += '</div>';
    }
    card += '</div>';
    return card;
  }).join('');
}

/* ------------------------------------------------------------------ */
/* Guía rápida (contenido de la UT 4)                                   */
/* ------------------------------------------------------------------ */
function gRows(rows) {
  return rows.map(r => '<div class="row">' + (r[2] ? '<span class="sw" style="background:' + r[2] + '"></span>' : '') + '<div><b>' + r[0] + '</b> — ' + r[1] + '</div></div>').join('');
}
function gDl(items) {
  return '<dl>' + items.map(i => '<dt>' + i[0] + '</dt><dd>' + i[1] + '</dd>').join('') + '</dl>';
}

function guiaHTML() {
  let h = '<div class="guide">';

  h += '<details><summary>🧭 Antes de catar</summary><div class="gbody"><ul>' +
    '<li><b>Boca limpia</b> (sin tabaco, caramelos ni pasta de dientes) y sin perfumes fuertes.</li>' +
    '<li><b>Fondo blanco</b> (mantel o papel) para ver bien el color.</li>' +
    '<li><b>La copa se coge por el pie o el tallo</b>, nunca por el cáliz. Llénala solo 1/3 (la copa normalizada tiene 50 ml de degustación).</li>' +
    '<li><b>Concentración:</b> la cata es individual; sin gestos ni comentarios hasta el final. Rellena la ficha mientras catas.</li>' +
    '<li><b>Temperatura:</b> con la ideal (o algo por encima) salen todos los aromas; si está demasiado caliente manda el alcohol.</li></ul>' +
    '<h5>Orden de cata</h5><div class="rule">Secos antes que dulces · jóvenes antes que crianzas · vinos de mediana calidad antes que grandes vinos.</div></div></details>';

  h += '<details><summary>👁 Fase visual</summary><div class="gbody">' +
    '<div class="rule">Con el tiempo, <b>los blancos se oscurecen y los tintos se aclaran</b>: los colores convergen.</div>' +
    '<h5>Ribete de los tintos</h5>' + gRows([
      ['Violáceo', 'vino muy joven (última cosecha).', '#7A2E7A'],
      ['Frambuesa', 'vino joven.', '#B03A5B'],
      ['Granate', 'vino algo más maduro.', '#8E2433'],
      ['Teja / ladrillo', 'más de 5 años en botella o crianza larga.', '#B4553A']
    ]) +
    '<p>El <b>ribete</b> (borde u orilla) es el color menos intenso del vino si lo comparamos con el centro de la copa.</p>' +
    '<h5>Tintos: color y edad</h5>' + gRows([
      ['Violáceo', 'muy joven.', '#5B1A34'],
      ['Rojo cereza / picota', 'ni joven ni evolucionado.', '#971B3A'],
      ['Matices anaranjados (teja)', 'madurez de crianza; envejecimiento (3 a 7 años).', '#7A3B2E'],
      ['Rojo pardo / amarronado', 'apogeo en un gran vino; en uno vulgar, envejecimiento excesivo.', '#5C3A2E']
    ]) +
    '<h5>Blancos: color y edad</h5>' + gRows([
      ['Casi incoloro / verdoso', 'muy joven o joven, vinificado en cuba.', '#D3DE85'],
      ['Pajizo u oro', 'madurez; tal vez criado en madera.', '#E3B94F'],
      ['Oro cobrizo', 'ya viejo.', '#C98B2C'],
      ['Ámbar tirando a ocre', 'oxidado, vino pasado.', '#A8742A']
    ]) +
    '<h5>Rosados</h5>' + gRows([
      ['Rosa frambuesa / salmón', 'joven y frutal, listo para beber.', '#E5758F'],
      ['Piel de cebolla', 'empieza a ser demasiado viejo.', '#E8B89B']
    ]) +
    '<h5>Otros aspectos</h5><ul>' +
    '<li><b>Limpidez:</b> brillante, limpio, velado (película densa de partículas) o turbio. No confundas turbidez con sedimentos naturales de un vino viejo.</li>' +
    '<li><b>Capa (intensidad):</b> baja, media-baja, media, media-alta o alta. Vino <i>cubierto</i> = capa media-alta o alta.</li>' +
    '<li><b>Lágrima / fluidez:</b> a más lágrima, más graduación: vino denso o «glicérico».</li></ul></div></details>';

  h += '<details><summary>👃 Fase olfativa</summary><div class="gbody">' +
    '<p>El olfato es unas <b>10.000 veces más sensible</b> que el gusto. Se huele en tres momentos:</p><ul>' +
    '<li><b>Copa parada:</b> aromas primarios, propios de la variedad (sobre todo frutales y florales).</li>' +
    '<li><b>Moviendo la copa:</b> aparecen enseguida los secundarios (fermentación) y más tarde los terciarios (crianza).</li>' +
    '<li><b>«Rompiendo» la copa</b> (agitar tapando con la mano): solo si hay un aroma esquivo o una anomalía difícil de detectar.</li></ul>' +
    '<h5>Tres familias de aromas</h5>' + gRows([
      ['Primarios o varietales', 'de la uva (y el terruño): fruta, flores, hierbas, minerales, especias.'],
      ['Secundarios o de fermentación', 'levaduras y azúcares: pan, brioche, yogur, plátano. No deben prevalecer sobre los primarios.'],
      ['Terciarios o de crianza (bouquet)', 'barrica y botella: frutos secos, miel, cacao, cuero, vainilla, cedro, humo. La serie animal-empireumática es propia de tintos.']
    ]) +
    '<h5>Cómo describir un olor</h5><ul><li><b>Intensidad:</b> fuerte, media o débil.</li><li><b>Calidad:</b> agradable o desagradable (finura, sutileza, originalidad).</li><li><b>Clase:</b> identificar el olor.</li></ul></div></details>';

  h += '<details><summary>👅 Fase gustativa</summary><div class="gbody">' +
    '<div class="rule">La boca confirma lo que anunciaron la vista y la nariz.</div>' +
    '<h5>Qué analizamos</h5>' + gRows([
      ['Equilibrio', 'un vino equilibrado es aquel en el que ningún sabor sobresale: el dulce se compensa con salado, ácido, amargo y umami.'],
      ['Astringencia', 'aspereza y sequedad producidas por los taninos.'],
      ['Acidez', 'frescura y capacidad de guarda (envejecimiento).'],
      ['Alcohol', 'sensación de calidez; ardor si hay desequilibrio.'],
      ['Carbónico', 'en espumosos: refrescante, ni excesivo ni escaso.'],
      ['Cuerpo', 'sensación de «grosor» o «finura» del vino.'],
      ['Persistencia', 'tiempo que tarda en desaparecer el sabor tras tragar: vino largo o corto.']
    ]) +
    '<h5>Etapas en boca</h5><ul>' +
    '<li><b>Entrada o ataque:</b> primera sensación. Jóvenes: frescos, con fruta y acidez. Viejos: menos efusivos pero más complejos.</li>' +
    '<li><b>Desarrollo:</b> textura, cremosidad, burbujas; el calor de la boca libera nuevos aromas (vía retronasal).</li>' +
    '<li><b>Final:</b> lo que deja tras ingerirlo (goloso, amargo…) y cuánto dura.</li></ul></div></details>';

  h += '<details><summary>📖 Vocabulario</summary><div class="gbody">' +
    '<h5>Visual</h5>' + gDl([
      ['Abierto', 'color muy claro, poco intenso.'],
      ['Acerado', 'color pálido de brillos metálicos, en algunos blancos.'],
      ['Brillante', 'relacionado con la juventud y la limpidez del vino.'],
      ['Caoba', 'tono marrón-amarillo de generosos y destilados viejos.'],
      ['Cubierto', 'tinto tan oscuro que apenas deja ver el fondo de la copa.'],
      ['Guinda', 'más claro que un tinto y más oscuro que un rosado.'],
      ['Oro viejo', 'dorado con tonalidad algo marrón.'],
      ['Ribete', 'borde u orilla del vino; revela su edad.']
    ]) +
    '<h5>Olfativo</h5>' + gDl([
      ['Balsámico', 'eucalipto, incienso, alquitrán; o crianza en madera acelerada por el calor.'],
      ['Elegante / fino', 'matices nobles de poca intensidad pero muy armonizados.'],
      ['Flor', 'aroma punzante y salino del fino y la manzanilla, por la capa de levaduras.'],
      ['Lías', 'aroma herbáceo y ligeramente tostado de vinos fermentados con sus lías.'],
      ['Monte bajo', 'romero, tomillo y otras hierbas del monte mediterráneo.'],
      ['Notas minerales', 'recuerdan al pedernal, la pizarra o la arena.'],
      ['Reducción', 'aromas por falta de aire en botella: tabaco, cuero, vainilla, cacao.'],
      ['Terroso', 'tierra recién mojada y polvo, en tintos de uvas maduras.'],
      ['Vainilla', 'típico de vinos criados en roble (vainillina de la madera).']
    ]) +
    '<h5>Gustativo</h5>' + gDl([
      ['Aterciopelado', 'suave y placentero: taninos y acidez pulidos por el tiempo en botella.'],
      ['Blando', 'poca acidez y falto de frescura.'],
      ['Cálido', 'el lado bueno del alcohol.'],
      ['Carnoso', 'con cuerpo y estructura: se «mastica».'],
      ['Complejo', 'conjunto de matices muy rico, difícil de precisar.'],
      ['Equilibrado', 'ningún componente sobresale.'],
      ['Largo', 'el sabor persiste tras tragar.'],
      ['Redondo', 'sin aristas, suave y con volumen.'],
      ['Tánico', 'tacto ligeramente áspero por los taninos.'],
      ['Untuoso', 'tacto graso, cálido y ligeramente dulzón de algunos vinos dulces.'],
      ['Vigoroso', 'vino de gran poder alcohólico.']
    ]) +
    '</div></details>';

  h += '<p class="footnote">Resumen de la UT 4 · Análisis sensorial o cata de vinos.</p></div>';
  return h;
}

function render() {
  const root = document.getElementById('app');
  const body = tab === 'nueva' ? nuevaCataHTML() : (tab === 'guia' ? guiaHTML() : fichasHTML());
  root.innerHTML = headerHTML() + tabsHTML() + body;
  const photoInput = document.getElementById('photo-input');
  if (photoInput) photoInput.onchange = handlePhotoChange;
}

render();
</script>
